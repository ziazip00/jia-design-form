<!doctype html><html lang="ko"><meta charset="utf-8"><style>body{font:13px system-ui;padding:18px;color:#23374a}button,input{margin:8px 0;padding:10px}p{line-height:1.7}</style><h2>지아디자인폼 레이어 교환</h2><p>디자인 JSON을 선택하면 새로운 프레임으로 가져옵니다. 내보낼 때는 프레임 하나를 선택하세요. 지원하지 않는 요소는 이미지로 변환됩니다.</p><input id="file" type="file" accept=".json"><button id="export">선택 프레임 JSON 저장</button><p id="status" role="status"></p><script>
const status=document.getElementById('status');
document.getElementById('file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>50000000)throw Error('50MB 이하 파일을 선택하세요.');parent.postMessage({pluginMessage:{type:'import',document:JSON.parse(await f.text())}},'*');status.textContent='가져오는 중…';}catch(e){status.textContent=e.message;}};
document.getElementById('export').onclick=()=>{parent.postMessage({pluginMessage:{type:'export'}},'*');status.textContent='변환 중…';};
onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;status.textContent=m.message||'';if(m.document){const url=URL.createObjectURL(new Blob([JSON.stringify(m.document)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='figma-jia.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}};
</script></html>
